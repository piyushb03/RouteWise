version: '3.8'

services:
  routewise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routewise-app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_SECRET_KEY=change-this-in-production-random-secure-secret-key-992182
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      - NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
      - OSRM_BASE_URL=https://router.project-osrm.org
      - MAP_USER_AGENT=RouteWise-HOS-ELD-Docker/1.0
      - MAP_CONTACT_EMAIL=planner@routewise.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
