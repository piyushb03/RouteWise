name: RouteWise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Checks & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System & Deployment Checks
        working-directory: ./backend
        env:
          DJANGO_SECRET_KEY: ci-testing-secret-key-3482740921849102849102
          DJANGO_DEBUG: false
        run: |
          python manage.py check
          python manage.py check --deploy

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          DJANGO_SECRET_KEY: ci-testing-secret-key-3482740921849102849102
          DJANGO_DEBUG: false
        run: |
          python -m pytest

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React SPA
        working-directory: ./frontend
        run: npm run build
