    <!-- Immediate theme initializer: defaults strictly to light unless explicitly saved as dark -->
    <script>
      (function() {
        try {
          // Purge legacy storage key from old sessions
          if (localStorage.getItem('routewise-ui-theme')) {
            localStorage.removeItem('routewise-ui-theme');
          }
          var saved = localStorage.getItem('routewise-theme-mode');
          var isDark = saved === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            if (saved !== 'light') {
              localStorage.setItem('routewise-theme-mode', 'light');
            }
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased selection:bg-slate-900 selection:text-white">
    <div id="root"></div>

  </body>
